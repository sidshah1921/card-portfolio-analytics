version: 2

semantic_models:
  - name: account_month
    description: Account x month delinquency and balance facts (fct_account_month).
    model: ref('fct_account_month')
    defaults:
      agg_time_dimension: statement_month
    entities:
      - name: account_month
        type: primary
        expr: account_month_id
      - name: account
        type: foreign
        expr: account_id
      - name: customer
        type: foreign
        expr: customer_id
    dimensions:
      - name: statement_month
        type: time
        type_params:
          time_granularity: month
      - name: product_name
        type: categorical
      - name: delinquency_bucket
        description: Current, 30, 60, 90, 120, 150 or CO (180 DPD charge-off).
        type: categorical
      - name: prior_delinquency_bucket
        description: Bucket in the prior month (Current ... 150; CO is terminal).
        type: categorical
        expr: prior_bucket
      - name: fico_band
        type: categorical
      - name: utilization_band
        type: categorical
    measures:
      # Stock measures (point-in-time balances / counts) are semi-additive: they add across
      # accounts and products but not across time. At a coarser grain than month MetricFlow
      # returns the value for the last month in the period (window_choice: max).
      - name: active_account_count
        description: Open, non-charged-off accounts (stock; end-of-period at coarser grains).
        agg: sum
        expr: case when is_active then 1 else 0 end
        non_additive_dimension:
          name: statement_month
          window_choice: max
      - name: dpd30_plus_account_count
        description: Accounts 30-179 DPD (stock; end-of-period at coarser grains).
        agg: sum
        expr: case when is_30plus then 1 else 0 end
        non_additive_dimension:
          name: statement_month
          window_choice: max
      - name: active_balance
        description: Outstanding balance of active accounts (stock; end-of-period at coarser grains).
        agg: sum
        expr: case when is_active then balance else 0 end
        non_additive_dimension:
          name: statement_month
          window_choice: max
      - name: active_credit_limit
        description: Credit limit of active accounts (stock; end-of-period at coarser grains).
        agg: sum
        expr: case when is_active then credit_limit else 0 end
        non_additive_dimension:
          name: statement_month
          window_choice: max

      # Flow / event measures are fully additive across time.
      - name: active_balance_months
        description: >
          Sum of monthly active balances (balance-months). Additive by design - dividing a flow by
          it gives a rate per average balance per month, which annualizes correctly at any grain.
        agg: sum
        expr: case when is_active then balance else 0 end
      - name: roll_forward_count
        description: Month-over-month transitions where the bucket worsened (flow).
        agg: sum
        expr: case when is_roll_forward then 1 else 0 end
      - name: roll_eligible_count
        description: Month-over-month transitions observed, i.e. accounts with a prior month (flow).
        agg: sum
        expr: case when has_prior_month then 1 else 0 end
      - name: gross_charge_off_amount
        description: Balances written off at 180 DPD (flow).
        agg: sum

  - name: payment
    description: Payment transactions (fct_payments).
    model: ref('fct_payments')
    defaults:
      agg_time_dimension: payment_month
    entities:
      - name: payment
        type: primary
        expr: payment_id
      - name: account
        type: foreign
        expr: account_id
    dimensions:
      - name: payment_month
        type: time
        type_params:
          time_granularity: month
      - name: payment_type
        type: categorical
    measures:
      - name: recovery_amount
        description: Payments received after charge-off (flow).
        agg: sum
        expr: case when payment_type = 'Recovery' then amount else 0 end

metrics:
  # ---------------------------------------------------------------- headline metrics
  - name: active_accounts
    label: Active accounts
    description: >
      Number of open, non-charged-off accounts. Semi-additive - at quarter/year grain it returns
      the count for the last month of the period, never a sum of months.
    type: simple
    type_params:
      measure: active_account_count
    config:
      meta:
        owner: Credit Risk Analytics
        formula: "COUNT(accounts WHERE delinquency_bucket <> 'CO'), last month of period"
        grain: account x month
        additivity: semi-additive (stock)

  - name: delinquency_rate_30plus
    label: 30+ DPD delinquency rate
    description: >
      Share of active accounts that are 30 to 179 days past due, i.e. in buckets
      30, 60, 90, 120 or 150. Charged-off accounts (CO, 180 DPD) are excluded from both
      numerator and denominator.
    type: ratio
    type_params:
      numerator: dpd30_plus_accounts
      denominator: active_accounts
    config:
      meta:
        owner: Credit Risk Analytics
        formula: "COUNT(active accounts with 30 <= DPD < 180) / COUNT(active accounts), last month of period"
        grain: account x month
        additivity: ratio of semi-additive stocks (end-of-period rate)

  - name: utilization_rate
    label: Utilization rate
    description: Outstanding balance of active accounts as a share of their credit limit.
    type: ratio
    type_params:
      numerator: receivables
      denominator: credit_lines
    config:
      meta:
        owner: Portfolio Management
        formula: "SUM(balance) / SUM(credit_limit), active accounts, last month of period"
        grain: account x month
        additivity: ratio of semi-additive stocks (end-of-period rate)

  - name: roll_rate
    label: Roll rate (forward)
    description: >
      Share of accounts whose delinquency bucket worsened versus the prior month, on the
      ladder Current -> 30 -> 60 -> 90 -> 120 -> 150 -> CO (charge-off at 180 DPD).
      Slice by prior_delinquency_bucket for bucket-to-bucket roll rates (e.g. Current -> 30,
      150 -> CO).
    type: ratio
    type_params:
      numerator: roll_forward_accounts
      denominator: roll_eligible_accounts
    config:
      meta:
        owner: Credit Risk Analytics
        formula: "COUNT(bucket rank(t) > bucket rank(t-1)) / COUNT(accounts with a row in t-1)"
        grain: account x month transition
        additivity: ratio of additive flows (average monthly roll rate over the period)

  - name: net_charge_off_rate
    label: Net charge-off rate (annualized)
    description: >
      Gross charge-offs less recoveries over the period, annualized, divided by average
      receivables. Using balance-months as the denominator makes the annualization correct at any
      grain: 12 * NCO / SUM(monthly balances) = (NCO / months) * 12 / average balance.
    type: derived
    type_params:
      expr: (gross_charge_offs - recoveries) * 12 / receivable_balance_months
      metrics:
        - name: gross_charge_offs
        - name: recoveries
        - name: receivable_balance_months
    config:
      meta:
        owner: Finance - Credit Loss Reporting
        formula: "12 * (SUM(gross charge-off $) - SUM(recoveries $)) / SUM(monthly active balance)"
        grain: month or coarser (portfolio or product)
        additivity: ratio of additive flows

  # ------------------------------------------------------- component metrics
  - name: dpd30_plus_accounts
    label: 30+ DPD accounts
    description: Active accounts 30-179 days past due (buckets 30, 60, 90, 120, 150).
    type: simple
    type_params:
      measure: dpd30_plus_account_count
    config:
      meta: {owner: Credit Risk Analytics, formula: "COUNT(30 <= DPD < 180), last month of period", grain: account x month, additivity: semi-additive (stock)}

  - name: receivables
    label: Receivables
    description: Outstanding balance of active accounts (end of period).
    type: simple
    type_params:
      measure: active_balance
    config:
      meta: {owner: Finance - Credit Loss Reporting, formula: "SUM(balance), active accounts, last month of period", grain: account x month, additivity: semi-additive (stock)}

  - name: receivable_balance_months
    label: Receivable balance-months
    description: Sum of monthly active balances over the period (= average receivables x months). NCO denominator.
    type: simple
    type_params:
      measure: active_balance_months
    config:
      meta: {owner: Finance - Credit Loss Reporting, formula: "SUM over months of SUM(balance), active accounts", grain: account x month, additivity: additive}

  - name: credit_lines
    label: Credit lines
    description: Total credit limit of active accounts.
    type: simple
    type_params:
      measure: active_credit_limit
    config:
      meta: {owner: Portfolio Management, formula: "SUM(credit_limit), active accounts, last month of period", grain: account x month, additivity: semi-additive (stock)}

  - name: roll_forward_accounts
    label: Roll-forward accounts
    description: Accounts whose bucket worsened versus the prior month.
    type: simple
    type_params:
      measure: roll_forward_count
    config:
      meta: {owner: Credit Risk Analytics, formula: "COUNT(bucket rank increased)", grain: account x month, additivity: additive}

  - name: roll_eligible_accounts
    label: Roll-eligible accounts
    description: Accounts with a prior-month observation.
    type: simple
    type_params:
      measure: roll_eligible_count
    config:
      meta: {owner: Credit Risk Analytics, formula: "COUNT(has prior month)", grain: account x month, additivity: additive}

  - name: gross_charge_offs
    label: Gross charge-offs
    description: Balances written off when accounts roll from the 150 bucket to CO at 180 DPD.
    type: simple
    type_params:
      measure: gross_charge_off_amount
    config:
      meta: {owner: Finance - Credit Loss Reporting, formula: "SUM(balance at 180 DPD)", grain: account x month, additivity: additive}

  - name: recoveries
    label: Recoveries
    description: Payments collected on previously charged-off accounts.
    type: simple
    type_params:
      measure: recovery_amount
    config:
      meta: {owner: Finance - Credit Loss Reporting, formula: "SUM(post-charge-off payments)", grain: payment, additivity: additive}

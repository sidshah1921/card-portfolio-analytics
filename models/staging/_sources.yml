version: 2

sources:
  - name: raw
    description: >
      Raw CSV extracts landed by scripts/generate_data.py. Read in place by dbt-duckdb
      (all columns as VARCHAR, exactly as delivered) - typing, deduplication and defect
      handling happen in staging. Source tests are severity `warn`: they are expected to
      fire because the extracts deliberately contain defects. They document the problem;
      staging fixes it and the staging/mart tests (severity `error`) prove nothing leaks.
    meta:
      external_location: "read_csv('{{ var('raw_data_path') }}/{name}.csv', header = true, all_varchar = true)"
    tables:
      - name: raw_customers
        description: One row per customer as delivered by the origination system.
        columns:
          - name: customer_id
            data_tests:
              - unique: {config: {severity: warn}}
              - not_null: {config: {severity: warn}}
      - name: raw_accounts
        description: One row per card account as delivered by the account master.
        columns:
          - name: account_id
            data_tests:
              - unique: {config: {severity: warn}}
              - not_null: {config: {severity: warn}}
      - name: raw_statements
        description: >
          Monthly statement snapshot per account. Known defects - exact duplicate rows,
          restated rows (a preliminary version superseded by a later, late-arriving load),
          late-arriving loads and null FICO refreshes.
        columns:
          - name: fico_refresh
            description: Monthly bureau score refresh; the bureau feed has gaps.
            data_tests:
              - not_null: {config: {severity: warn}}
      - name: raw_payments
        description: >
          Payment transactions. Known defects - negative amounts (processor reversal noise),
          re-delivered duplicate payment_ids, orphan account references, late loads.
        columns:
          - name: payment_id
            data_tests:
              - unique: {config: {severity: warn}}
          - name: account_id
            data_tests:
              - relationships:
                  arguments: {to: "source('raw', 'raw_accounts')", field: account_id}
                  config: {severity: warn}
